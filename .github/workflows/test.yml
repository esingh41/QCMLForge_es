name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.12
        environment-file: environment.yml
        activate-environment: qcml
        auto-activate-base: false
    
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e .
    
    - name: Run tests
      shell: bash -l {0}
      run: |
        python -m pytest tests/
